spring.application.name=order-processor
spring.jackson.deserialization.use-big-decimal-for-floats=true
# Mongo local de docker-compose. serverSelectionTimeoutMS acota cuanto bloquea una
# escritura con Mongo caido antes de fallar como PERSISTENCE (default del driver: 30 s).
spring.data.mongodb.uri=mongodb://localhost:27017/b2b_orders?serverSelectionTimeoutMS=5000
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=order-processor

# Virtual threads (propuesta §6.1): Tomcat y scheduler. El listener los configura en KafkaConfig (nota K8).
spring.threads.virtual.enabled=true

# Logs JSON (formato Logstash): una linea por evento, MDC y key-values como campos de primer nivel.
logging.structured.format.console=logstash

# Solo actuator. 8081 para no chocar con products-api (8080) en el host.
server.port=8081
management.endpoints.web.exposure.include=health,prometheus
